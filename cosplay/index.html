<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="https://avatars.githubusercontent.com/u/80595346?v=4%253F" type="image/x-icon">

        <!-- main -->
        <meta name="owner" content="IchimakiKasura" />
        <meta name="title" content="Ichimaki Kasura | Socials" />
        <meta name="description" content="Ichimaki Kasura's Social Links" />
        <meta property="image" content="https://ichimakikasura.github.io/cosplay/download.png" />
        <!-- fb -->
        <meta property="og:url" content="https://ichimakikasura.github.io/cosplay" />
        <meta property="og:type" content="website">
        <meta property="og:title" content="Ichimaki Kasura | Socials" />
        <meta property="og:description" content="Ichimaki Kasura's Social Links" />
        <meta property="og:image" content="https://ichimakikasura.github.io/cosplay/download.png" />
        <!-- twitter -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:creator" content="IchimakiKasura" />
        <meta name="twitter:title" content="Ichimaki Kasura | Socials" />
        <meta name="twitter:description" content="Ichimaki Kasura's Social Links" />
        <meta name="twitter:image" content="https://ichimakikasura.github.io/cosplay/download.png" />

        <title>Ichimaki's social</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="modal.css">
        <link rel="stylesheet" href="cherry-blossom.css">
    </head>

    <body>
        <!-- Cherry Blossom Effect -->
        <div class="cherry-blossom-container" id="cherryBlossomContainer"></div>

        <div class="floating-window">
            <h1 class="header">Ichimaki Kasura</h1>
            <p class="paragraph">A <i>(femboy)</i> Cosplayer with washed coding and editing skills </p>

            <div class="image-placeholder">
                <img src="main.jpg" alt="Placeholder Image">
            </div>

            <p class="text-placeholder">For sponsorships or Collaborations, Feel free to contact me below.</p>

            <button class="contact-button" id="contactBtn">Contact Me</button>

            <!-- Modal Popup -->
            <div id="contactModal" class="modal">
                <div class="modal-content">
                    <span class="close">&times;</span>
                    <div class="modal-image-placeholder">
                        <img src="woah.jpg" alt="Profile Image">
                    </div>
                    <p>Currently busy and not available for collab yet hehe</p>
                    <button class="modal-btn" id="closeBtn">Got it!</button>
                </div>
            </div>

            <div class="social-buttons">
                <a href="https://www.facebook.com/ichimaki.cos" target="_blank" class="social-btn facebook">
                    <img src="fb.png" alt="Facebook">
                </a>
                <a href="https://www.tiktok.com/@ichimaki.cos" target="_blank" class="social-btn tiktok">
                    <img src="tiktok.png" alt="TikTok">
                </a>
                <a href="https://www.instagram.com/ichimaki.cos" target="_blank"  class="social-btn instagram">
                    <img src="ig.png" alt="Instagram">
                </a>
                <a href="https://www.github.com/IchimakiKasura" target="_blank"  class="social-btn Github">
                    <img src="https://skillicons.dev/icons?i=github" alt="Github">
                </a>
            </div>
        </div>

        <p class="text-footer">All made by yours trully terrible coder with a passion on cosplaying lmao</p>

        <script>
            const contactBtn = document.getElementById('contactBtn');
            const contactModal = document.getElementById('contactModal');
            const closeBtn = document.getElementById('closeBtn');
            const closeSpan = document.querySelector('.close');

            contactBtn.addEventListener('click', function() {
                contactModal.style.display = 'block';
            });

            closeBtn.addEventListener('click', function() {
                contactModal.style.display = 'none';
            });

            closeSpan.addEventListener('click', function() {
                contactModal.style.display = 'none';
            });

            window.addEventListener('click', function(event) {
                if (event.target === contactModal) {
                    contactModal.style.display = 'none';
                }
            });
        </script>
        <script src="cherry-blossom.js"></script>

    </body>
</html>
