    <body>
        <div class="cherry-blossom-container" id="cherryBlossomContainer"></div>
        <div class="floating-window">
            <h1 class="header">Ichimaki Kasura</h1>
            <p class="paragraph">A <i>(femboy)</i> Cosplayer with washed coding and editing skills </p>

            <div class="image-placeholder">
                <img src="images/main.jpg" alt="main image lmao" loading="lazy">

                <button class="contact-button" id="contactBtn">Contact Me</button>
                <button class="donate-button" id="donateBtn">Donate</button>
            </div>

            <div id="dynamicModal" class="modal">
                <div class="modal-content">
                    <span class="close">&times;</span>
                    <div class="modal-image-placeholder" id="modalImageContainer" style="display: none;">

                    </div>
                    <p id="modalText">Modal content</p>
                    <button class="modal-btn" id="closeBtn">Omkie!</button>
                </div>
            </div>

            <div class="social-buttons">
                <a href="https://www.facebook.com/ichimaki.cos" target="_blank" class="social-btn" title="Facebook">
                    <img src="images/fb.png" alt="Facebook" loading="lazy">
                </a>
                <a href="https://www.tiktok.com/@ichimaki.cos" target="_blank" class="social-btn" title="TikTok">
                    <img src="images/tiktok.png" alt="TikTok" loading="lazy">
                </a>
                <a href="https://www.instagram.com/ichimaki.cos" target="_blank"  class="social-btn" title="Instagram">
                    <img src="images/ig.png" alt="Instagram" loading="lazy">
                </a>
                <a href="https://www.github.com/IchimakiKasura" target="_blank"  class="social-btn" title="Github">
                    <img src="https://skillicons.dev/icons?i=github" alt="Github" loading="lazy">
                </a>
                <a href="https://www.youtube.com/@KasuraIchimaki" target="_blank"  class="social-btn" title="Youtube">
                    <img src="images/youtube.png" alt="youtube" loading="lazy">
                </a>
                <a href="https://discord.com/users/716593062217908274" target="_blank"  class="social-btn" title="Discord">
                    <img src="https://skillicons.dev/icons?i=discord" alt="discord" loading="lazy">
                </a>
                <a class="social-btn" onclick="window.open('https://www.youtube.com/watch?v=dQw4w9WgXcQ&list=RDdQw4w9WgXcQ')" title="OnlyFans">
                    <img src="images/onlyfans.webp" alt="overflow" loading="lazy" style="object-fit: contain;">
                </a>
            </div>
        <p class="text-footer">All made by yours truly terrible coder with a passion on cosplaying lmao</p>
