<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="https://avatars.githubusercontent.com/u/80595346?v=4%253F" type="image/x-icon">

        <!-- main -->
        <meta name="owner" content="IchimakiKasura" />
        <meta name="title" content="Ichimaki Kasura | Socials" />
        <meta name="description" content="Ichimaki Kasura's Social Links" />
        <meta property="image" content="https://ichimakikasura.github.io/cosplay/download.png" />
        <!-- fb -->
        <meta property="og:url" content="https://ichimakikasura.github.io/cosplay" />
        <meta property="og:type" content="website">
        <meta property="og:title" content="Ichimaki Kasura | Socials" />
        <meta property="og:description" content="Ichimaki Kasura's Social Links" />
        <meta property="og:image" content="https://ichimakikasura.github.io/cosplay/download.png" />
        <!-- twitter -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:creator" content="IchimakiKasura" />
        <meta name="twitter:title" content="Ichimaki Kasura | Socials" />
        <meta name="twitter:description" content="Ichimaki Kasura's Social Links" />
        <meta name="twitter:image" content="https://ichimakikasura.github.io/cosplay/download.png" />

        <title>Ichimaki's social</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="modal.css">
        <link rel="stylesheet" href="cherry-blossom.css">
    </head>

    <body>
        
        <div class="cherry-blossom-container" id="cherryBlossomContainer"></div>

        <div class="floating-window">
            <h1 class="header">Ichimaki Kasura</h1>
            <p class="paragraph">A <i>(femboy)</i> Cosplayer with washed coding and editing skills </p>

            <div class="image-placeholder">
                <img src="main.jpg" alt="Placeholder Image">
            </div>

            <p class="text-placeholder">For sponsorships or Collaborations, Feel free to contact me below.</p>

            <div class="buttons-container">
                <button class="contact-button" id="contactBtn">Contact Me</button>
                <button class="donate-button" id="donateBtn">Donate</button>
            </div>

            <!-- Dynamic Modal -->
            <div id="dynamicModal" class="modal">
                <div class="modal-content">
                    <span class="close">&times;</span>
                    <div class="modal-image-placeholder" id="modalImageContainer" style="display: none;">
                        <img id="modalImage" src="" alt="Modal Image">
                    </div>
                    <p id="modalText">Modal content</p>
                    <button class="modal-btn" id="closeBtn">Omkie!</button>
                </div>
            </div>

            <div class="social-buttons">
                <a href="https://www.facebook.com/ichimaki.cos" target="_blank" class="social-btn facebook">
                    <img src="fb.png" alt="Facebook">
                </a>
                <a href="https://www.tiktok.com/@ichimaki.cos" target="_blank" class="social-btn tiktok">
                    <img src="tiktok.png" alt="TikTok">
                </a>
                <a href="https://www.instagram.com/ichimaki.cos" target="_blank"  class="social-btn instagram">
                    <img src="ig.png" alt="Instagram">
                </a>
                <a href="https://www.github.com/IchimakiKasura" target="_blank"  class="social-btn Github">
                    <img src="https://skillicons.dev/icons?i=github" alt="Github">
                </a>
            </div>
        </div>

        <p class="text-footer">All made by yours trully terrible coder with a passion on cosplaying lmao</p>

        <script>
            const contactBtn = document.getElementById('contactBtn');
            const donateBtn = document.getElementById('donateBtn');
            const dynamicModal = document.getElementById('dynamicModal');
            const closeBtn = document.getElementById('closeBtn');
            const closeSpan = document.querySelector('.close');
            const modalImageContainer = document.getElementById('modalImageContainer');
            const modalImage = document.getElementById('modalImage');
            const modalText = document.getElementById('modalText');
            const imagePlaceholder = document.querySelector('.image-placeholder');

            // Mouse tracking for shiny effect
            imagePlaceholder.addEventListener('mousemove', function(e) {
                const rect = imagePlaceholder.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width) * 100;
                imagePlaceholder.style.setProperty('--mouse-x', `${x}%`);
                imagePlaceholder.querySelector('::after').style.opacity = '1';
            });

            imagePlaceholder.addEventListener('mouseleave', function() {
                imagePlaceholder.style.setProperty('--mouse-x', '-100%');
            });

            // Touch support for mobile
            imagePlaceholder.addEventListener('touchmove', function(e) {
                const rect = imagePlaceholder.getBoundingClientRect();
                const touch = e.touches[0];
                const x = ((touch.clientX - rect.left) / rect.width) * 100;
                imagePlaceholder.style.setProperty('--mouse-x', `${x}%`);
            });

            imagePlaceholder.addEventListener('touchend', function() {
                imagePlaceholder.style.setProperty('--mouse-x', '-100%');
            });

            function openModal(imageUrl, text, borderRadius = '50%', imageSize = '120px') {
                if (imageUrl) {
                    modalImage.src = imageUrl;
                    modalImageContainer.style.borderRadius = borderRadius;
                    modalImage.style.borderRadius = borderRadius;
                    modalImageContainer.style.width = imageSize;
                    modalImageContainer.style.height = imageSize;
                    modalImageContainer.style.display = 'flex';
                } else {
                    modalImageContainer.style.display = 'none';
                }
                modalText.textContent = text;
                dynamicModal.style.display = 'block';
            }

            function closeModal() {
                dynamicModal.style.display = 'none';
            }

            contactBtn.addEventListener('click', function() {
                openModal('woah.jpg', 'Currently busy and not available for collab yet hehe', '50%', '120px');
            });

            donateBtn.addEventListener('click', function() {
                openModal('gcash.png', 'Support my cosplay journey! Any donations are greatly appreciated! ❤️', '10px', '300px');
            });

            closeBtn.addEventListener('click', closeModal);
            closeSpan.addEventListener('click', closeModal);

            window.addEventListener('click', function(event) {
                if (event.target === dynamicModal) {
                    closeModal();
                }
            });
        </script>
        <script src="cherry-blossom.js"></script>

    </body>
</html>
